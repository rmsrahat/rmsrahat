<svg viewBox="0 0 1180 340" xmlns="http://www.w3.org/2000/svg" width="1180" height="340">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F7FF"/>
      <stop offset="50%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#F8FAFF"/>
    </linearGradient>

    <linearGradient id="blueGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8">
        <animate attributeName="stop-color" values="#1D4ED8;#2563EB;#0EA5E9;#1D4ED8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#0EA5E9;#2563EB;#0284C7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="shadowL" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(37,99,235,0.12)"/>
    </filter>

    <linearGradient id="shimmerL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(37,99,235,0)"/>
      <stop offset="40%" style="stop-color:rgba(37,99,235,0.5)"/>
      <stop offset="60%" style="stop-color:rgba(59,130,246,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(6,182,212,0)"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowLeftL" cx="25%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#DBEAFE;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowRightL" cx="75%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#E0F2FE;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:0"/>
    </radialGradient>

    <linearGradient id="panelGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.95)"/>
      <stop offset="100%" style="stop-color:rgba(239,246,255,0.9)"/>
    </linearGradient>

    <linearGradient id="pillGrad1L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(219,234,254,0.8)"/>
      <stop offset="100%" style="stop-color:rgba(207,250,254,0.6)"/>
    </linearGradient>

    <clipPath id="mainClipL"><rect x="0" y="0" width="1180" height="340" rx="16"/></clipPath>
    <clipPath id="leftClipL"><rect x="12" y="12" width="415" height="316" rx="12"/></clipPath>
    <clipPath id="rightClipL"><rect x="442" y="12" width="726" height="316" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#mainClipL)">
    <!-- Background -->
    <rect width="1180" height="340" fill="url(#bgGradL)"/>

    <!-- Ambient blobs -->
    <ellipse cx="295" cy="170" rx="280" ry="200" fill="url(#glowLeftL)">
      <animate attributeName="rx" values="280;310;280" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="885" cy="120" rx="320" ry="220" fill="url(#glowRightL)">
      <animate attributeName="rx" values="320;290;320" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Particles (lighter) -->
    <g opacity="0.4">
      <circle cx="100" cy="60" r="1.5" fill="#3B82F6">
        <animate attributeName="cy" values="60;20;60" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="350" cy="100" r="1.5" fill="#0EA5E9">
        <animate attributeName="cy" values="100;70;100" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="800" cy="50" r="1" fill="#3B82F6">
        <animate attributeName="cy" values="50;20;50" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="150" r="1.5" fill="#06B6D4">
        <animate attributeName="cy" values="150;110;150" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Panel divider -->
    <line x1="435" y1="12" x2="435" y2="328" stroke="url(#blueGradL)" stroke-width="1" opacity="0.25"/>

    <!-- ===== LEFT PANEL ===== -->
    <g clip-path="url(#leftClipL)">
      <rect x="12" y="12" width="415" height="316" rx="12" fill="url(#panelGradL)" filter="url(#shadowL)"/>
      <rect x="12" y="12" width="415" height="316" rx="12" fill="none" stroke="rgba(37,99,235,0.15)" stroke-width="1"/>

      <circle cx="36" cy="36" r="5" fill="#FF5F57"/>
      <circle cx="54" cy="36" r="5" fill="#FEBC2E"/>
      <circle cx="72" cy="36" r="5" fill="#28C840"/>
      <text x="145" y="40" font-family="monospace" font-size="10" fill="#94A3B8">~/rmsrahat</text>
      <line x1="12" y1="52" x2="427" y2="52" stroke="rgba(37,99,235,0.12)" stroke-width="1"/>

      <!-- Floating code block -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="4s" repeatCount="indefinite" additive="sum"/>

        <g font-family="'Courier New', monospace" font-size="11">
          <text x="32" y="82" opacity="0">
            <tspan fill="#1D4ED8">██</tspan><tspan fill="#2563EB">████</tspan><tspan fill="#3B82F6">██</tspan><tspan fill="#60A5FA">▓▒░</tspan>
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.1;1" dur="4s" fill="freeze"/>
          </text>
          <text x="32" y="97" opacity="0">
            <tspan fill="#1E40AF">██</tspan><tspan fill="#2563EB">░░░░</tspan><tspan fill="#3B82F6">██</tspan><tspan fill="#60A5FA">░░</tspan>
            <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.1;0.15;0.2;1" dur="4s" fill="freeze"/>
          </text>
          <text x="32" y="112" opacity="0">
            <tspan fill="#1D4ED8">██</tspan><tspan fill="#3B82F6">████</tspan><tspan fill="#60A5FA">██</tspan><tspan fill="#93C5FD">░░░</tspan>
            <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.15;0.2;0.25;0.3;1" dur="4s" fill="freeze"/>
          </text>
          <text x="32" y="127" opacity="0">
            <tspan fill="#2563EB">██</tspan><tspan fill="#3B82F6">▄▄</tspan><tspan fill="#60A5FA">░░░░</tspan>
            <animate attributeName="opacity" values="0;0;0;0;0;1;1" keyTimes="0;0.2;0.25;0.3;0.35;0.4;1" dur="4s" fill="freeze"/>
          </text>
        </g>

        <!-- Name graphic -->
        <g opacity="0" filter="url(#glowL)">
          <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;0.7" dur="4s" fill="freeze"/>
          <rect x="50" y="172" width="10" height="60" rx="2" fill="url(#blueGradL)"/>
          <rect x="50" y="172" width="35" height="10" rx="2" fill="url(#blueGradL)"/>
          <rect x="50" y="196" width="30" height="8" rx="2" fill="url(#blueGradL)"/>
          <rect x="73" y="182" width="12" height="22" rx="6" fill="url(#blueGradL)"/>
          <rect x="72" y="205" width="28" height="9" rx="2" fill="url(#blueGradL)" transform="rotate(30 72 205)"/>

          <rect x="110" y="172" width="10" height="60" rx="2" fill="url(#nameGradL)"/>
          <rect x="150" y="172" width="10" height="60" rx="2" fill="url(#nameGradL)"/>
          <rect x="110" y="172" width="25" height="9" rx="2" fill="url(#nameGradL)" transform="rotate(30 110 172)"/>
          <rect x="140" y="172" width="25" height="9" rx="2" fill="url(#nameGradL)" transform="rotate(-30 165 172)"/>

          <path d="M185 172 Q185 172 210 172 Q220 172 220 182 Q220 192 185 196 Q175 200 175 210 Q175 222 185 230 Q195 232 210 232" stroke="url(#blueGradL)" stroke-width="10" fill="none" stroke-linecap="round"/>
        </g>

        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;0.75" dur="4s" fill="freeze"/>
          <text x="50" y="257" font-family="monospace" font-size="11" fill="#94A3B8">// Software Engineer</text>
          <text x="50" y="272" font-family="monospace" font-size="11" fill="#94A3B8">// AIUB · Dhaka 🇧🇩</text>
        </g>

        <rect x="50" y="286" width="8" height="14" rx="1" fill="#2563EB">
          <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <text x="62" y="297" font-family="monospace" font-size="11" fill="#1D4ED8">$</text>
        <text x="72" y="297" font-family="monospace" font-size="11" fill="#3B82F6">_</text>
      </g>
    </g>

    <!-- ===== RIGHT PANEL ===== -->
    <g clip-path="url(#rightClipL)">
      <rect x="442" y="12" width="726" height="316" rx="12" fill="rgba(255,255,255,0.9)" filter="url(#shadowL)"/>
      <rect x="442" y="12" width="726" height="316" rx="12" fill="none" stroke="rgba(37,99,235,0.12)" stroke-width="1"/>
      <rect x="442" y="12" width="726" height="1" fill="url(#shimmerL)"/>

      <circle cx="466" cy="36" r="5" fill="#FF5F57"/>
      <circle cx="484" cy="36" r="5" fill="#FEBC2E"/>
      <circle cx="502" cy="36" r="5" fill="#28C840"/>
      <text x="560" y="40" font-family="monospace" font-size="10" fill="#94A3B8">profile.tsx — rmsrahat</text>
      <line x1="442" y1="52" x2="1168" y2="52" stroke="rgba(37,99,235,0.1)" stroke-width="1"/>

      <text x="464" y="80" font-family="monospace" font-size="13" fill="#94A3B8" opacity="0">
        Hi there 👋
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1;0.2" dur="5s" fill="freeze"/>
      </text>

      <text x="464" y="108" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="url(#nameGradL)" opacity="0">
        Rms Rahat
        <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.15;0.25;0.35" dur="5s" fill="freeze"/>
      </text>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.2;0.3;0.4" dur="5s" fill="freeze"/>
        <text x="464" y="133" font-family="monospace" font-size="13" fill="#2563EB">
          <tspan>&gt; </tspan><tspan>Software Engineer</tspan><tspan fill="#3B82F6">|</tspan>
          <animate attributeName="opacity" values="1;1;0;0;1;1;0;0;1" keyTimes="0;0.12;0.13;0.37;0.38;0.62;0.63;0.87;1" dur="12s" repeatCount="indefinite"/>
        </text>
        <text x="464" y="133" font-family="monospace" font-size="13" fill="#0284C7">
          <tspan>&gt; </tspan><tspan>Full Stack Developer</tspan><tspan fill="#0EA5E9">|</tspan>
          <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.12;0.13;0.37;0.38;0.62;0.63;0.87;1" dur="12s" repeatCount="indefinite"/>
        </text>
        <text x="464" y="133" font-family="monospace" font-size="13" fill="#1D4ED8">
          <tspan>&gt; </tspan><tspan>Open Source Enthusiast</tspan><tspan fill="#2563EB">|</tspan>
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.12;0.13;0.37;0.38;0.62;0.63;0.87;1" dur="12s" repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity="0"><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.3;0.4;0.5" dur="5s" fill="freeze"/>
        <text x="464" y="160" font-family="monospace" font-size="11" fill="#94A3B8">📍</text>
        <text x="486" y="160" font-family="monospace" font-size="11" fill="#64748B">Dhaka, Bangladesh</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.35;0.45;0.55" dur="5s" fill="freeze"/>
        <text x="464" y="178" font-family="monospace" font-size="11" fill="#94A3B8">🎓</text>
        <text x="486" y="178" font-family="monospace" font-size="11" fill="#64748B">Software Engineering @ AIUB</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.4;0.5;0.6" dur="5s" fill="freeze"/>
        <text x="464" y="196" font-family="monospace" font-size="11" fill="#94A3B8">⚡</text>
        <text x="486" y="196" font-family="monospace" font-size="11" fill="#64748B">React Native · PHP/MVC · Firebase</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;0;0;1" keyTimes="0;0.45;0.55;0.65" dur="5s" fill="freeze"/>
        <text x="464" y="214" font-family="monospace" font-size="11" fill="#94A3B8">🌐</text>
        <text x="486" y="214" font-family="monospace" font-size="11" fill="#2563EB">github.com/rmsrahat</text>
      </g>

      <line x1="464" y1="226" x2="850" y2="226" stroke="rgba(37,99,235,0.1)" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;0.7" dur="5s" fill="freeze"/>
      </line>

      <text x="464" y="248" font-family="monospace" font-size="10" fill="#94A3B8" letter-spacing="2" opacity="0">
        SKILLS<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.62;0.72" dur="5s" fill="freeze"/>
      </text>

      <g opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.65;0.75" dur="5s" fill="freeze"/>
        <rect x="464" y="256" width="44" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
        <text x="486" y="270" font-family="monospace" font-size="9" fill="#1D4ED8" text-anchor="middle">PHP</text>
        <rect x="514" y="256" width="56" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
        <text x="542" y="270" font-family="monospace" font-size="9" fill="#0284C7" text-anchor="middle">React</text>
        <rect x="576" y="256" width="36" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
        <text x="594" y="270" font-family="monospace" font-size="9" fill="#1D4ED8" text-anchor="middle">JS</text>
        <rect x="618" y="256" width="62" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
        <text x="649" y="270" font-family="monospace" font-size="9" fill="#0284C7" text-anchor="middle">Firebase</text>
        <rect x="686" y="256" width="52" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
        <text x="712" y="270" font-family="monospace" font-size="9" fill="#1D4ED8" text-anchor="middle">MySQL</text>
        <rect x="744" y="256" width="38" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
        <text x="763" y="270" font-family="monospace" font-size="9" fill="#0284C7" text-anchor="middle">C++</text>
        <rect x="788" y="256" width="36" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(37,99,235,0.25)" stroke-width="1"/>
        <text x="806" y="270" font-family="monospace" font-size="9" fill="#1D4ED8" text-anchor="middle">Git</text>
        <rect x="830" y="256" width="56" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(14,165,233,0.25)" stroke-width="1"/>
        <text x="858" y="270" font-family="monospace" font-size="9" fill="#0284C7" text-anchor="middle">Node.js</text>
        <rect x="892" y="256" width="44" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(37,99,235,0.2)" stroke-width="1"/>
        <text x="914" y="270" font-family="monospace" font-size="9" fill="#1D4ED8" text-anchor="middle">Expo</text>
        <rect x="942" y="256" width="38" height="20" rx="10" fill="url(#pillGrad1L)" stroke="rgba(14,165,233,0.2)" stroke-width="1"/>
        <text x="961" y="270" font-family="monospace" font-size="9" fill="#0284C7" text-anchor="middle">CSS</text>
