        <circle cx="475" cy="307" r="8" fill="none" stroke="rgba(37,99,235,0.3)" stroke-width="1"/>
        <text x="475" y="311" text-anchor="middle" font-size="8" fill="#2563EB">GH</text>
        <text x="488" y="311" font-size="9" fill="#64748B">github.com/rmsrahat</text>
        <circle cx="648" cy="307" r="8" fill="none" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
